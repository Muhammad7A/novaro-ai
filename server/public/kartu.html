<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kartu Kesehatan Usaha — Novaro</title>
<meta name="description" content="Kartu kesehatan usaha yang dibagikan pemilik UMKM lewat Novaro — ringkasan skor keuangan, omzet, dan laba dari catatan kas harian.">
<style>
:root{
  --paper:#FBFBF7; --card:#FFFFFF; --ink:#1A1F2B; --ink-soft:#5A6478;
  --blue:#2B6CB0; --blue-deep:#1A365D; --blue-tint:#EBF4FF;
  --gold:#D69E2E; --gold-tint:#FFFFF0; --line:#E2E8F0;
  --green:#2F855A; --green-tint:rgba(72,187,120,.14);
  --red:#E53E3E; --red-tint:#FFF5F5;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper:#0F172A; --card:#1E293B; --ink:#F8FAFC; --ink-soft:#94A3B8;
    --blue:#3B82F6; --blue-deep:#93C5FD; --blue-tint:#1E3A8A;
    --gold:#F59E0B; --gold-tint:#451A03; --line:#334155;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:var(--paper);color:var(--ink);line-height:1.6;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;padding:32px 16px;
  -webkit-font-smoothing:antialiased;
}
.wrap{width:100%;max-width:460px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em;margin-bottom:22px}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:.85rem}
.brand small{display:block;font-size:.68rem;font-weight:600;color:var(--ink-soft);letter-spacing:.08em;text-transform:uppercase}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:28px 24px;box-shadow:0 2px 6px rgba(26,31,43,.06),0 16px 40px rgba(26,31,43,.08);
}
.usaha{font-size:1.35rem;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.jenis{font-size:.85rem;color:var(--ink-soft);margin-top:2px}
.skor{display:flex;gap:20px;align-items:center;margin:20px 0;padding:18px;background:var(--blue-tint);border-radius:16px}
.dial{width:96px;height:96px;flex:none;position:relative;display:grid;place-items:center}
.dial svg{position:absolute;inset:0;transform:rotate(-90deg)}
.dial-track{fill:none;stroke:rgba(43,108,176,.18);stroke-width:9}
.dial-fill{fill:none;stroke:var(--blue);stroke-width:9;stroke-linecap:round;transition:stroke-dasharray .8s ease}
.dial-num{font-size:1.7rem;font-weight:800;line-height:1;letter-spacing:-.03em}
.skor-label{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.skor-status{font-size:1.05rem;font-weight:800;margin-top:2px}
.baris{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.baris:last-of-type{border-bottom:none}
.baris span{color:var(--ink-soft)}
.baris b{font-variant-numeric:tabular-nums;text-align:right}
.insight{margin-top:14px;padding:14px;background:var(--gold-tint);border-radius:12px;border:1px solid var(--gold)}
.insight h4{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.insight li{margin-left:18px;font-size:.88rem}
.periode{margin-top:14px;font-size:.78rem;color:var(--ink-soft)}
.disclaimer{margin-top:12px;font-size:.74rem;color:var(--ink-soft);font-style:italic}
.footer{margin-top:24px;text-align:center;font-size:.78rem;color:var(--ink-soft)}
.footer b{color:var(--ink)}
.galat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:36px 28px;text-align:center;box-shadow:0 2px 6px rgba(26,31,43,.06)}
.galat .big{font-size:2.6rem;margin-bottom:10px}
.galat p{color:var(--ink-soft);font-size:.92rem;margin-top:6px}
.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--blue);border-right-color:transparent;border-radius:50%;animation:putar .7s linear infinite}
@keyframes putar{to{transform:rotate(360deg)}}
@media print{
  body{padding:0;background:#fff}
  .card{box-shadow:none;border:none;border-radius:0}
  .footer .aksi{display:none}
}
.brand-logo{width:30px;height:30px;border-radius:50%;object-fit:cover}</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="mark">N</div>
    <div>Novaro<small>Kartu Kesehatan Usaha</small></div>
  </div>

  <div id="isi" class="card" style="text-align:center">
    <span class="spin"></span>
  </div>

  <div class="footer">
    <p>Dibuat dengan <b>Novaro</b> — pendamping keuangan untuk UMKM.</p>
    <p class="aksi">Angka di kartu ini ringkasan baca-saja yang dibagikan pemilik usaha, bukan akun. Data lengkap tidak ikut dibagikan.</p>
  </div>
</div>

<script>
/*
 * Halaman publik kartu kesehatan — baca-saja, tanpa login.
 *
 * Token diambil dari JALUR (/kartu/kartu_XXXX…), bukan query string, lalu
 * dipakai memanggil satu-satunya endpoint publik yang ada. Endpoint itu
 * menjawab proyeksi daftar putih — id internal, kode akses, dan transaksi
 * satu per satu tidak pernah ikut — jadi halaman ini tidak punya apa pun
 * yang bisa dipakai masuk ke akun pemiliknya.
 */
const token = decodeURIComponent(location.pathname.split('/').pop() ?? '');

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const rp = (n) => n == null ? '—' : 'Rp ' + new Intl.NumberFormat('id-ID').format(Math.round(Number(n)));

function tampil(k) {
  const skor = k.skorKesehatan ?? 0;
  const panjang = 2 * Math.PI * 42;
  const terisi = (skor / 100) * panjang;
  const konsistensi = k.konsistensi?.hariBulan
    ? k.konsistensi.hariTercatat + ' dari ' + k.konsistensi.hariBulan + ' hari bulan ini'
    : (k.periode.hariSejakMulai ? 'sejak ' + k.periode.hariSejakMulai + ' hari terakhir' : '—');

  document.getElementById('isi').innerHTML = `
    <div class="usaha">${esc(k.namaUsaha)}</div>
    <div class="jenis">${esc(k.jenisUsaha ?? 'Usaha mikro Indonesia')}</div>
    <div class="skor">
      <div class="dial">
        <svg viewBox="0 0 96 96">
          <circle class="dial-track" cx="48" cy="48" r="42"></circle>
          <circle class="dial-fill" cx="48" cy="48" r="42" stroke-dasharray="${terisi} ${panjang}"></circle>
        </svg>
        <div class="dial-num">${skor}</div>
      </div>
      <div>
        <div class="skor-label">Skor Kesehatan</div>
        <div class="skor-status">${esc(k.statusKesehatan ?? '—')}</div>
      </div>
    </div>
    <div class="baris"><span>Omzet setara bulanan</span><b>${rp(k.omzet)}</b></div>
    <div class="baris"><span>Laba bersih setara bulanan</span><b>${rp(k.labaBersih)}</b></div>
    <div class="baris"><span>Konsistensi pencatatan</span><b>${esc(konsistensi)}</b></div>
    <div class="insight">
      <h4>Catatan utama</h4>
      <ul>${(k.insight ?? []).map((i) => `<li>${esc(i.judul)}</li>`).join('')}</ul>
    </div>
    <div class="periode">Periode data: ${k.periode.hariSejakMulai || '—'} hari pencatatan${k.periode.bulanLengkap ? ', termasuk bulan penuh tercatat' : ''}. Angka ${k.sumberAngka === 'catatan' ? 'dihitung dari buku kas' : 'masih perkiraan profil'}. Dibuat ${new Date(k.dibuatPada).toLocaleDateString('id-ID', { dateStyle: 'long' })}.</div>
    <div class="disclaimer">Ringkasan edukatif dari catatan pemilik usaha sendiri — bukan jaminan, bukan keputusan kredit. Keputusan KUR sepenuhnya ada di bank.</div>`;

  document.querySelector('.dial-fill').style.strokeDasharray = `${terisi} ${panjang}`;
}

function galat(pesan) {
  document.getElementById('isi').className = 'galat';
  document.getElementById('isi').innerHTML = `<div class="big">🔎</div><h2>Kartu tidak ditemukan</h2><p>${esc(pesan)}</p>`;
}

(async () => {
  if (!/^kartu_[A-Za-z0-9_-]{20,}$/.test(token)) {
    galat('Tautan kartu ini tidak valid atau sudah tidak berlaku.');
    return;
  }
  try {
    const res = await fetch('/api/kartu/publik/' + encodeURIComponent(token));
    if (!res.ok) {
      galat(res.status === 404
        ? 'Tautan ini mungkin sudah lama, salah ketik, atau kartunya sudah ditarik pemiliknya.'
        : 'Kartu belum bisa dibuka. Coba beberapa saat lagi.');
      return;
    }
    const data = await res.json();
    tampil(data.kartu);
  } catch {
    galat('Koneksi bermasalah. Periksa internet lalu muat ulang halaman ini.');
  }
})();
</script>
</body>
</html>
