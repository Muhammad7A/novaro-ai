# Nginx untuk Nova Explorer — Compute Engine.
#
#   sudo cp deploy/nginx-nova.conf /etc/nginx/sites-available/nova
#   sudo ln -s /etc/nginx/sites-available/nova /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d nova.domainmu.id
#
# Ganti nova.domainmu.id dengan domainmu sendiri.

server {
    listen 80;
    listen [::]:80;
    server_name nova.domainmu.id;

    # certbot akan menambahkan blok pengalihan ke HTTPS di sini sendiri.

    # Batas ukuran badan permintaan. Aplikasi sendiri sudah membatasi 256 KB;
    # angka di sini menolaknya lebih awal, sebelum sempat sampai ke Node.
    client_max_body_size 512k;

    # ---- Kompresi ----------------------------------------------------------
    # Tiga aset besar (index.html, modul.js, validasi.html) SUDAH dikompresi
    # aplikasi sendiri dan datang dengan Content-Encoding: gzip — Nginx
    # meneruskannya apa adanya. Baris di bawah untuk sisanya (jawaban JSON).
    #
    # `text/event-stream` sengaja TIDAK ada di daftar: aliran jawaban AI tidak
    # boleh ditahan sampai penyangga penuh, karena seluruh gunanya justru
    # muncul sedikit demi sedikit.
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;
    gzip_proxied any;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Alamat IP asli peserta. Tanpa ini seluruh permintaan terlihat datang
        # dari 127.0.0.1, dan satu penebak kode akan mengunci pembatas login
        # untuk SEMUA peserta sekaligus. Aplikasi perlu TRUST_PROXY=1 agar
        # header ini dipercaya.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---- Aliran jawaban AI ---------------------------------------------
        # WAJIB. Dengan penyangga menyala, jawaban Claude ditahan Nginx sampai
        # selesai lalu muncul sekaligus — peserta menatap layar kosong selama
        # belasan detik dan mengira aplikasinya menggantung.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Probe kesehatan tidak perlu memenuhi log akses; ia datang tiap beberapa
    # detik, selamanya.
    location = /api/health {
        access_log off;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }
}
